# Format de log avec IP réelle
log_format real_ip '$http_x_forwarded_for - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name localhost;

    # Logs avec IP réelle
    access_log /var/log/nginx/access.log real_ip;
    error_log /var/log/nginx/error.log warn;

    # Configuration pour récupérer l'IP réelle depuis HAProxy
    set_real_ip_from 10.0.0.0/24;     # Réseau de HAProxy
    set_real_ip_from 172.16.0.0/12;   # Si Docker réseau
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; connect-src http: https: wss:" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;
    gzip_min_length 1000;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;

        if ($request_method !~ ^(GET|HEAD|POST)$) {
            return 444;
        }
    }

    location /api/v1/ {
        proxy_pass ${ApiUrl}/ivoiredu-api/api/v1/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ \.(php|phtml|php3|php4|php5|php7|phps|pht|asp|aspx|jsp|sh|cgi|pl|py|rb)$ {
        deny all;
        return 404;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
