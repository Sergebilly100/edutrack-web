name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://edutrack:edutrack@localhost:5432/edutrack
      DATABASE_URL_TEST: postgresql://edutrack:edutrack@localhost:5432/edutrack
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      SMS_MOCK: "true"
      BUNDLE_GZIP_LIMIT_BYTES: "614400"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --ignore-pattern "edutrack-api/**"

      - name: Run tests
        run: npm run test

      - name: Verify cross-repo checkout config
        run: |
          echo "Web repository: ${{ github.repository }}"
          echo "API repository target: ${{ vars.EDUTRACK_API_REPOSITORY || format('{0}/edutrack-api', github.repository_owner) }}"
          if [ "${{ github.event.repository.private }}" = "true" ] && [ -z "${{ secrets.CI_REPO_ACCESS_TOKEN }}" ]; then
            echo "::error::Missing secret CI_REPO_ACCESS_TOKEN. Required for cross-repository checkout when repositories are private."
            exit 1
          fi

      - name: Checkout API repository
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.EDUTRACK_API_REPOSITORY || format('{0}/edutrack-api', github.repository_owner) }}
          path: edutrack-api
          token: ${{ secrets.CI_REPO_ACCESS_TOKEN || github.token }}

      - name: Start PostgreSQL and Redis for E2E backend
        run: docker compose -f ./edutrack-api/docker-compose.yml up -d postgres redis

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec edutrack-postgres pg_isready -U edutrack -d postgres >/dev/null 2>&1; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time."
          exit 1

      - name: Wait for Redis
        run: |
          for i in {1..30}; do
            if docker exec edutrack-redis redis-cli ping | grep -q PONG; then
              echo "Redis is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Redis did not become ready in time."
          exit 1

      - name: Install API dependencies
        run: npm ci
        working-directory: ./edutrack-api

      - name: Prepare JWT keys for E2E backend
        run: |
          openssl genpkey -algorithm RSA -out private.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -pubout -in private.pem -out public.pem
          {
            echo "JWT_PRIVATE_KEY<<EOF"
            cat private.pem
            echo "EOF"
            echo "JWT_PUBLIC_KEY<<EOF"
            cat public.pem
            echo "EOF"
          } >> "$GITHUB_ENV"
        working-directory: ./edutrack-api

      - name: Migrate and seed API database
        run: |
          npm run db:migrate
          npm run db:seed
        working-directory: ./edutrack-api

      - name: Run API integration tests
        run: npm run test:integration
        working-directory: ./edutrack-api

      - name: Start API test backend
        run: npm run dev > /tmp/edutrack-api.log 2>&1 &
        working-directory: ./edutrack-api

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -sS http://127.0.0.1:3000/health >/dev/null; then
              echo "API is ready."
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time."
          cat /tmp/edutrack-api.log || true
          exit 1

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build pour E2E
        run: npm run build

      - name: Run Playwright E2E (all roles)
        run: npm run e2e -- --project=director-tests
        env:
          E2E_BASE_URL: http://localhost:4173
          E2E_RUN_AUTH_SETUP: "true"
          E2E_API_URL: http://localhost:3000/api/v1
          VITE_API_URL: http://localhost:3000/api/v1
          CI: true

      - name: Run Playwright E2E (teacher + super admin + staff)
        run: npm run e2e -- --project=teacher-tests --project=admin-tests --project=staff-tests
        env:
          E2E_BASE_URL: http://localhost:4173
          E2E_RUN_AUTH_SETUP: "true"
          E2E_API_URL: http://localhost:3000/api/v1
          VITE_API_URL: http://localhost:3000/api/v1
          CI: true

      - name: Show API logs on failure
        if: failure()
        run: cat /tmp/edutrack-api.log || true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-and-results
          path: |
            playwright-report/
            test-results/
            /tmp/edutrack-api.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Report asset sizes
        run: du -sh dist/assets/*.js | sort -h

      - name: Enforce initial gzipped JS size budget
        run: |
          limit="${BUNDLE_GZIP_LIMIT_BYTES:-614400}"
          total=0
          files=()
          for file in dist/assets/index-*.js; do
            [ -e "$file" ] && files+=("$file")
          done
          for file in dist/assets/workbox-window*.js; do
            [ -e "$file" ] && files+=("$file")
          done

          if [ ${#files[@]} -eq 0 ]; then
            echo "No initial JavaScript assets found (index/workbox-window)."
            exit 1
          fi

          for file in "${files[@]}"; do
            size=$(gzip -c "$file" | wc -c | tr -d ' ')
            echo "$(basename "$file"): ${size} bytes gz"
            total=$((total + size))
          done

          echo "Initial gzipped JS size: ${total} bytes (limit: ${limit} bytes)"
          if [ "$total" -gt "$limit" ]; then
            echo "Initial bundle size check failed: ${total} > ${limit} bytes"
            exit 1
          fi

      - name: Stop backend services
        if: always()
        run: docker compose -f ./edutrack-api/docker-compose.yml down -v --remove-orphans || true
