---
# ============================================================================
# Pipeline CI/CD V3 : Ultimate (Semantic-release, Strict, Secure, Immutable)
# ============================================================================
# 1. Dev     -> Build et Déploiement continus sur chaque commit (+ Scan Trivy)
# 2. Staging -> Job Semantic-Release crée le tag `vX.Y.Z-rc.N` 
#               La CI du tag build, scanne et déploie l'image RC en Staging.
# 3. Master  -> Job Semantic-Release crée le tag `vX.Y.Z` final. 
#               La CI du tag promeut l'image via Skopeo et la déploie en Prod.
# ============================================================================

workflow:
  rules:
    # 1. Si la pipeline est déclenchée par un Tag (ex: v1.0.0 ou v1.0.0-rc.1)
    - if: $CI_COMMIT_TAG
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG
        
    # 2. Si la pipeline est déclenchée par un push sur la branche development
    - if: $CI_COMMIT_BRANCH == "development"
      variables:
        IMAGE_TAG: "development"
    # 3. Règle par défaut (obligatoire pour ne pas bloquer les autres branches)
    - when: always

variables:
  # Désactive les appels externes vers Anchore
  SYFT_CHECK_FOR_APP_UPDATE: "false"
  GRYPE_CHECK_FOR_APP_UPDATE: "false"
  GRYPE_DB_AUTO_UPDATE: "false"

stages:
  - test
  - pre-release
  - build
  - scan
  - sign
  - deploy-prod
  - deploy-staging
  - deploy-dev
  - promote-to-prod
  - expose-prod
  - expose-staging
  - expose-dev


# ---------------------------------------------------------------------------
# VALIDATION DES COMMITS (Conventional Commits)
# ---------------------------------------------------------------------------
lint-commit:
  stage: test
  image:
    name: ${REGISTRY_URL}/outils-ci/semantic-release:latest
    entrypoint: [""]
  tags: [docker]
  script:
    - |
      echo "Vérification du format Conventional Commits..."
      COMMIT_MSG=$(git log -1 --pretty=%s)
      echo "Commit: ${COMMIT_MSG}"
      # Ignorer les merge commits (ex: Merge branch 'development' into 'staging')
      echo "${COMMIT_MSG}" | grep -qE '^Merge ' && { echo "Merge commit détecté, lint ignoré."; exit 0; }
      echo "${COMMIT_MSG}" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?:' \
        || { echo "ERROR: Le message '${COMMIT_MSG}' ne respecte pas le format Conventional Commits."; echo "Exemples: fix: ..., feat: ..., chore: ..."; exit 1; }
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "master"

# # ---------------------------------------------------------------------------
# # VERSIONING (SEMANTIC-RELEASE)
# # ---------------------------------------------------------------------------
release-version:
  stage: pre-release
  image: 
    name: ${REGISTRY_URL}/outils-ci/semantic-release:latest
    entrypoint: [""]
  tags: [docker]
  script:
    # - echo "192.168.4.2 gitlab.local" >> /etc/hosts
    - git fetch --tags --force --prune --prune-tags
    - npx semantic-release
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always  
    - if: $CI_COMMIT_BRANCH == "master"
      when: always

# ---------------------------------------------------------------------------
# BUILD UNIQUE (IMMUTABLE + CACHE)
# ---------------------------------------------------------------------------
build-image:
  stage: build
  tags: [build]
  image:
    name: ${REGISTRY_URL}/outils-ci/kaniko-executor:debug
    entrypoint: [""]
  before_script:
    # - touch .npmrc && echo "${NPMRC}" > .npmrc
    # - sed -i 's|https://registry.npmjs.org/|http://nexus.nexus3.orb.local/repository/npm-all/|g' server/package-lock.json client/package-lock.json
    - echo "{\"auths\":{\"${REGISTRY_URL}\":{\"auth\":\"$(printf "%s:%s" "${REGISTRY_USER}" "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - |
      echo "Registry URL: ${REGISTRY_URL}"
      echo "Registry User: ${REGISTRY_USER}"
    - |
      if [ "${ENV}" = "development" ]; then
        sed -i 's/npm run build/npm run build:dev/' Dockerfile
        echo "Dockerfile modifié pour build:dev (mode development)"
      else
        echo "Build standard conservé pour l'environnement ${ENV}"
      fi
  script:
    - /kaniko/executor 
        --context "${CI_PROJECT_DIR}" 
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" 
        --destination "${REGISTRY_URL}/${ENV}/${APP_NAME}:${IMAGE_TAG}"
        --cache=true
        --cache-repo="${REGISTRY_URL}/cache/${ENV}/${APP_NAME}"
        --digest-file="${CI_PROJECT_DIR}/image-digest.txt"
        --insecure --insecure-registry "${REGISTRY_URL}"
  artifacts:
    paths:
      - image-digest.txt
    expire_in: 2 hours 
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
      variables:
        ENV: "development"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
      variables:
        ENV: "staging"

# # ============================================
# # DEPLOIEMENT DEV & STAGING
# # ============================================

.deploy: &deploy
  tags: [build]
  image:
    name: ${REGISTRY_URL}/outils-ci/ansible-ci
    entrypoint: [""]
  variables:
    ANSIBLE_HOST_KEY_CHECKING: "False"
  before_script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  script:
    - cd ansible
    - chmod 700 .
    - |
      ansible-playbook deploy.yml \
        -e "environ=${ENV}" \
        -e "app_name=${APP_NAME}" \
        -e "image_tag=${IMAGE_TAG}" \
        -e "registry_url=${REGISTRY_URL}" \
        -e "domain_name=${DOMAIN_NAME_FULL}" \
        -e "app_port=${APP_PORT}" \
        -e "consul_http_token=${CONSUL_HTTP_TOKEN}"

deploy-staging:
  <<: *deploy
  stage: deploy-staging
  variables:
    ENV: "staging"
    DOMAIN_NAME_FULL: "staging.${DOMAIN_NAME}"
    APP_PORT: "${APP_PORT_STAGING}"
  before_script:
    - !reference [.deploy, before_script]
    - echo "ApiUrl=http://10.0.0.1:3000" > .env.staging
    - cp .env.staging ansible/
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

deploy-dev:
  <<: *deploy
  stage: deploy-dev
  variables:
    ENV: "development"
    DOMAIN_NAME_FULL: "dev.${DOMAIN_NAME}"
    APP_PORT: "${APP_PORT_DEV}"
  before_script:
    - !reference [.deploy, before_script]
    - echo "ApiUrl=http://10.0.0.1:4848" > .env.development
    - cp .env.development ansible/
  environment:
    name: development
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'

# ---------------------------------------------------------------------------
# 7. PROMOTION & DÉPLOIEMENT EN PROD
# ---------------------------------------------------------------------------

promote-release:
  stage: deploy-prod
  image: 
    name: ${REGISTRY_URL}/outils-ci/alpine-ci:latest
    entrypoint: [""]
  tags: [docker]
  variables:
    GIT_DEPTH: 0
  script:
    - |
      STABLE_TAG=${IMAGE_TAG}
      echo "STABLE_TAG: ${STABLE_TAG}"
      # Récupération du dernier tag RC (le plus récent sur staging)
      git fetch --tags --force --prune --prune-tags
      ALL_TAGS=$(git tag --sort=-v:refname)
      LAST_RC=$(echo "${ALL_TAGS}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' | head -1)
      echo "LAST_RC: ${LAST_RC}"

      # Vérification des variables
      [ -z "${STABLE_TAG}" ] && echo "ERROR: IMAGE_TAG non défini" && exit 1
      [ -z "${LAST_RC}" ] && echo "ERROR: Aucun tag RC trouvé" && exit 1

      echo "Promotion Skopeo : Copie de staging/${APP_NAME}:${LAST_RC} vers production/${APP_NAME}:${STABLE_TAG}"

      skopeo copy \
        --src-tls-verify=false \
        --dest-tls-verify=false \
        --src-creds="${REGISTRY_USER}:${REGISTRY_PASSWORD}" \
        --dest-creds="${REGISTRY_USER}:${REGISTRY_PASSWORD}" \
        docker://${REGISTRY_URL}/staging/${APP_NAME}:${LAST_RC} \
        docker://${REGISTRY_URL}/production/${APP_NAME}:${STABLE_TAG}
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual

verify-prod-image:
  stage: deploy-prod
  image:
    name: ${REGISTRY_URL}/outils-ci/alpine-ci:latest
    entrypoint: [""]
  tags: [docker]
  needs: ["promote-release"]
  script:
    - |
      echo "Vérification de l'image production/${APP_NAME}:${IMAGE_TAG}"
      skopeo inspect \
        --tls-verify=false \
        --creds="${REGISTRY_USER}:${REGISTRY_PASSWORD}" \
        docker://${REGISTRY_URL}/production/${APP_NAME}:${IMAGE_TAG} \
        || { echo "ERROR: Image production/${APP_NAME}:${IMAGE_TAG} introuvable"; exit 1; }
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

deploy-prod:
  <<: *deploy
  stage: deploy-prod
  needs: ["verify-prod-image"]
  variables:
    ENV: "production"
    DOMAIN_NAME_FULL: "${DOMAIN_NAME}"
    APP_PORT: "${APP_PORT_PROD}"
  before_script:
    - !reference [.deploy, before_script]
    - echo "ApiUrl=http://10.0.0.1:8080" > .env.production
    - cp .env.production ansible/
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/


# # ============================================
# # EXPOSITION DU PROJET REVERSE PROXY
# # ============================================
      
.update-haproxy: &update-haproxy
  tags:
    - docker
  image:
    name: ${REGISTRY_URL}/outils-ci/ansible-ci
    entrypoint: [""]
  variables:
    ANSIBLE_HOST_KEY_CHECKING: "False"
  before_script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  script:
    - cd ansible
    - |
      ansible-playbook expose.yml \
        -e "app_name=${APP_NAME}" \
        -e "domain_name=${DOMAIN_NAME_FULL}" \
        -e "app_port=${APP_PORT}" \
        -e "environ=${ENV}"

update-haproxy-prod:
  <<: *update-haproxy
  stage: expose-prod
  needs: ["deploy-prod"]
  variables:
    ENV: "production"
    DOMAIN_NAME_FULL: "${DOMAIN_NAME}"
    APP_PORT: "${APP_PORT_PROD}"
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

update-haproxy-staging:
  <<: *update-haproxy
  stage: expose-staging
  needs: ["deploy-staging"]
  variables:
    ENV: "staging"
    DOMAIN_NAME_FULL: "staging.${DOMAIN_NAME}"
    APP_PORT: "${APP_PORT_STAGING}"
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

update-haproxy-dev:
  <<: *update-haproxy
  stage: expose-dev
  needs: ["deploy-dev"]
  variables:
    ENV: "development"
    DOMAIN_NAME_FULL: "dev.${DOMAIN_NAME}"
    APP_PORT: "${APP_PORT_DEV}"
  environment:
    name: development
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
